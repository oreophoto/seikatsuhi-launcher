<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-title" content="生活費精算">
<title>生活費精算</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<style>
  html, body { margin: 0; min-height: 100%; background: #101114; color: #f2f3f7; }
  body { font: 14px/1.7 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: calc(32px + env(safe-area-inset-top)) 20px 32px; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p, li { color: #a9b0be; }
  ol { padding-left: 20px; }
  a { color: #9abcff; }
  [hidden] { display: none; }
</style>
<script>
  // 生活費精算アプリ（Google Apps Script）の入り口。ホーム画面のアイコンを出すためだけのページ。
  // GAS のウェブアプリには apple-touch-icon を付けられないので、ここに付けてアプリへ移動する。
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxo7AdUwiPbSQY1H5f4MBC9edyugFW79JFQ5jqV-SjO3swQYZZOiYOtesl9pV4hyZUq/exec';
  // iPhone はホーム画面に追加するとき、このURLを見えないところで読み込み直してアイコンを探す。
  // そこですぐ移動するとアプリ側のページを読んでしまい、アイコンが見つからない（タイトルの頭文字になる）。
  // そのため、画面に表示されているときだけ、読み込みが終わってから移動する。
  // #add は下でアドレスから消すので、最初に覚えておく
  var adding = location.hash === '#add';
  var moving = false;
  function openApp() {
    if (adding || moving || document.visibilityState !== 'visible') return;
    moving = true;
    setTimeout(function () { location.replace(APP_URL); }, 300);
  }
  window.addEventListener('load', openApp);
  document.addEventListener('visibilitychange', function () {
    if (document.readyState === 'complete') openApp();
  });
</script>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="">
  <h1>生活費精算</h1>
  <div id="add" hidden>
    <p>このページをホーム画面に追加すると、アイコンからアプリを開けます。</p>
    <ol>
      <li>Safari の共有ボタンから「ホーム画面に追加」を選ぶ</li>
      <li>「ウェブアプリとして開く」を<strong>オフ</strong>にして「追加」（オンだと、アプリが小さなブラウザの枠の中で開きます）</li>
    </ol>
  </div>
  <p id="opening">アプリを開いています… <a id="link">開かないときはこちら</a></p>
</main>
<script>
  document.getElementById('link').href = APP_URL;
  if (adding) {
    // ホーム画面には #add のないURLを登録させる（アイコンから開いたときはすぐアプリへ移動する）
    history.replaceState(null, '', location.pathname);
    document.getElementById('add').hidden = false;
    document.getElementById('opening').hidden = true;
  }
</script>
</body>
</html>
